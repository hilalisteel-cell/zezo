name: Build KidsTok APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add KidsTok logo
        run: |
          mkdir -p app/src/main/res/drawable
          curl --fail --location --retry 3 "https://kids-tok.com/kids_tok_logo.jpg" -o app/src/main/res/drawable/kidstok_logo.jpg

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsTok-PWA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
